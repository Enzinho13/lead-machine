<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadMachine - CRM</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --success-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .badge {
            background-color: var(--danger-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .details p {
            margin: 6px 0;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .problems-box {
            background-color: rgba(244, 63, 94, 0.1);
            border-left: 3px solid var(--danger-color);
            padding: 8px;
            margin: 10px 0;
            font-size: 0.85rem;
        }
        .message-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 10px;
            white-space: pre-wrap;
            color: #e2e8f0;
        }
        .btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>LeadMachine CRM</h1>
        <p>Painel de Oportunidades e Abordagem Automatizada</p>
    </header>

    <div class="container" id="lead-container">
        <!-- Os cards serão injetados dinamicamente aqui -->
    </div>

    <script>
        // Como o arquivo JSON está na raiz e o HTML na pasta dashboard, 
        // apontamos para o caminho relativo correto:
        fetch('../leads_qualificados.json')
            .then(response => response.json())
            .then(leads => {
                const container = document.getElementById('lead-container');
                
                if (leads.length === 0) {
                    container.innerHTML = '<p>Nenhum lead encontrado.</p>';
                    return;
                }

                leads.forEach(lead => {
                    let problemasHtml = lead.problemas.map(p => `<li>${p}</li>`).join('');

                    let card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span class="card-title">${lead.nome}</span>
                                <span class="badge">Score: ${lead.score}</span>
                            </div>
                            <div class="details">
                                <p><strong>Site:</strong> <a href="${lead.url}" target="_blank" style="color: var(--accent-color);">${lead.url}</a></p>
                                <p><strong>Prioridade:</strong> ${lead.prioridade.toUpperCase()}</p>
                                <p><strong>Serviço Sugerido:</strong> ${lead.servico_recomendado}</p>
                            </div>
                            <div class="problems-box">
                                <strong>Principais Falhas:</strong>
                                <ul style="margin: 5px 0 0 15px; padding: 0;">
                                    ${problemasHtml}
                                </ul>
                            </div>
                            <div style="font-size: 0.85rem; font-weight: bold; margin-top: 10px;">Mensagem Sugerida:</div>
                            <div class="message-box">${lead.mensagem_pronta}</div>
                        </div>
                        <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(lead.mensagem_pronta)}" target="_blank" class="btn">Enviar no WhatsApp</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Erro ao carregar os leads:', error);
                document.getElementById('lead-container').innerHTML = '<p style="color: red;">Erro ao carregar o arquivo leads_qualificados.json. Certifique-se de que o pipeline foi executado na raiz.</p>';
            });
    </script>
</body>
</html>
